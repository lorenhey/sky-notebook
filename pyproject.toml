[project]
name = "sky-notebook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "python-frontmatter>=1.3.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
sky-notebook = "sky_notebook:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
