[project]
name = "sky-notebook"
version = "2.0.0"
description = "Scientific notebook and observational logging suite for astronomical observation, session planning, and target tracking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.0.0",
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
    "pydantic>=2.5.0",
    "python-frontmatter>=1.0.0",
    "typer>=0.9.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
sky-notebook = "sky_notebook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
